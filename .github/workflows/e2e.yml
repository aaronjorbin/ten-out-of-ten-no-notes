name: E2E

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  playwright:
    name: Editor E2E — WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['latest', 'trunk']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Target WordPress trunk
        if: matrix.wordpress == 'trunk'
        run: echo '{"core":"WordPress/WordPress#master"}' > .wp-env.override.json

      - name: Start WordPress
        run: npm run env:start

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.wordpress }}
          path: artifacts/
          retention-days: 7

      - name: Stop WordPress
        if: always()
        run: npm run env:stop
